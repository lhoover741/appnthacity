<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | GTAVCAD</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-platform-page="true">
<header class="site-header"><div class="topbar container"><a class="brand" href="/">GTAVCAD</a><button class="nav-toggle" aria-label="Open navigation">Menu</button><nav class="global-nav" aria-label="Main navigation"><a href="/communities">Communities</a><a href="/login">Login</a><a class="button button-primary" href="/create-community">Create Community</a><a class="button button-ghost" href="/join-community">Join Community</a></nav></div></header>
<main>
  <section class="panel section page-hero"><div class="container"><p class="eyebrow">Welcome to GTAVCAD</p><h1>Login</h1><p class="intro">Sign in to select, create, or join your RP/CAD communities.</p></div></section>
  <section class="container section content-grid">
    <article class="card info-card">
      <h2>Account Login</h2>
      <form id="login-form" class="system-form">
        <label>Username or Email <input name="username" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="button button-primary" id="login-submit" type="submit">Login</button>
      </form>
      <p id="login-status" role="status"></p>
      <p><a href="#" id="forgot-password-link">Forgot Password?</a></p>
      <p>Need an account? <a href="/register">Register here</a>.</p>
    </article>
  </section>
</main>
<footer class="site-footer"><div class="container footer-grid"><p>&copy; <span class="current-year"></span> GTAVCAD.</p><p>Create or Join a Community.</p></div></footer>
<script src="/assets/js/main.js"></script>
<script>
const pendingInviteKey = 'gtavcad_pending_invite_code';
const loginInvite = new URLSearchParams(window.location.search).get('invite') || new URLSearchParams(window.location.search).get('code');
if (loginInvite) { sessionStorage.setItem(pendingInviteKey, loginInvite.toUpperCase()); localStorage.setItem(pendingInviteKey, loginInvite.toUpperCase()); }
async function joinPendingInviteAfterAuth() {
  const code = (sessionStorage.getItem(pendingInviteKey) || localStorage.getItem(pendingInviteKey) || '').trim().toUpperCase();
  if (!code) return null;
  const res = await fetch(`/api/invites/${encodeURIComponent(code)}/join`, {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:'{}'});
  const data = await res.json().catch(() => ({}));
  if (res.ok && data.success) {
    sessionStorage.removeItem(pendingInviteKey);
    localStorage.removeItem(pendingInviteKey);
    return data.redirect || (data.community?.slug ? `/c/${data.community.slug}/` : null);
  }
  return null;
}
document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const status = document.getElementById('login-status');
  const button = document.getElementById('login-submit');
  button.disabled = true;
  button.textContent = 'Logging in…';
  status.textContent = '';
  const form = new FormData(event.target);
  try {
    const res = await fetch('/api/auth/login', {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(form))});
    const data = await res.json();
    if (!res.ok || !data.success) {
      const errorByCode = {
        INVALID_CREDENTIALS: 'Invalid credentials. Please check your username/email and password.',
        ACCOUNT_NOT_FOUND: 'Account missing. Please register or verify your email/username.',
        SESSION_EXPIRED: 'Session expired. Please log in again.',
        AUTH_STATE_INVALID: 'Internal authentication error. Please contact support.',
      };
      status.textContent = errorByCode[data.code] || data.error || 'Login failed';
      button.disabled = false;
      button.textContent = 'Login';
      return;
    }
    status.textContent = 'Login successful. Checking invite…';
    const inviteRedirect = await joinPendingInviteAfterAuth();
    window.location.href = inviteRedirect || data.redirect || data.redirect_url || '/community-setup';
  } catch (err) {
    status.textContent = 'Internal authentication error. Please try again.';
    button.disabled = false;
    button.textContent = 'Login';
  }
});
document.getElementById('forgot-password-link').addEventListener('click', async (event) => {
  event.preventDefault();
  const identifier = prompt('Enter username or email for password reset token:');
  if (!identifier) return;
  const res = await fetch('/api/auth/forgot-password', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({identifier})});
  const data = await res.json();
  alert(data.reset_token ? `Reset token: ${data.reset_token}` : (data.message || 'If account exists, reset token generated.'));
});
</script>
</body>
</html>
