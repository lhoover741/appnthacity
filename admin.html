<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | NThaCityRP</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --surface: #111111;
      --surface-strong: #1a1a1a;
      --text: #ececec;
      --muted: #b3b3b3;
      --accent: #ff2d2d;
      --accent-dark: #8b0000;
      --border: rgba(255,45,45,0.16);
      --radius: 14px;
      --green: #4caf82;
      --yellow: #f5a623;
      --blue: #4a9eff;
      --gray: #555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }

    /* LOGIN */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .login-card {
      background: var(--surface-strong); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 48px 40px; width: 100%; max-width: 420px;
      text-align: center;
    }
    .login-card .brand { color: var(--accent); font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; }
    .login-card h2 { font-size: 1.1rem; color: var(--muted); font-weight: 400; margin-bottom: 32px; }
    .login-card input {
      width: 100%; padding: 14px 16px; background: #0b0b0b; border: 1px solid #333;
      border-radius: 8px; color: var(--text); font-size: 1rem; margin-bottom: 16px; outline: none;
    }
    .login-card input:focus { border-color: var(--accent); }
    .login-card .login-btn {
      width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .login-card .login-btn:hover { background: var(--accent-dark); }
    .login-error { color: #ff6b6b; font-size: 0.9rem; margin-top: 12px; min-height: 20px; }

    /* ADMIN PANEL */
    #admin-panel { display: none; }
    .admin-header {
      background: var(--surface); border-bottom: 1px solid #222;
      padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
      height: 64px; position: sticky; top: 0; z-index: 100;
    }
    .admin-header .brand { color: var(--accent); font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; }
    .admin-header .header-right { display: flex; align-items: center; gap: 16px; }
    .admin-header .header-right span { color: var(--muted); font-size: 0.9rem; }
    .logout-btn {
      background: transparent; border: 1px solid #333; color: var(--muted);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    .logout-btn:hover { border-color: var(--accent); color: var(--accent); }

    .admin-main { padding: 32px; max-width: 1200px; margin: 0 auto; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--surface-strong); border: 1px solid #222;
      border-radius: var(--radius); padding: 20px 24px;
    }
    .stat-card .stat-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 2rem; font-weight: 800; }
    .stat-card.total .stat-value { color: var(--text); }
    .stat-card.open .stat-value { color: var(--accent); }
    .stat-card.review .stat-value { color: var(--yellow); }
    .stat-card.resolved .stat-value { color: var(--green); }
    .stat-card.dismissed .stat-value { color: var(--gray); }

    /* FILTERS & TOOLBAR */
    .toolbar {
      display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 18px; border-radius: 20px; border: 1px solid #333;
      background: transparent; color: var(--muted); cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(255,45,45,0.08); }
    .search-box {
      margin-left: auto; padding: 8px 14px; background: var(--surface-strong);
      border: 1px solid #333; border-radius: 8px; color: var(--text); font-size: 0.9rem; width: 220px; outline: none;
    }
    .search-box:focus { border-color: var(--accent); }

    /* COMPLAINTS LIST */
    .complaints-list { display: flex; flex-direction: column; gap: 16px; }
    .complaint-card {
      background: var(--surface-strong); border: 1px solid #222;
      border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s;
    }
    .complaint-card:hover { border-color: #333; }
    .complaint-card.open { border-left: 3px solid var(--accent); }
    .complaint-card.under-review { border-left: 3px solid var(--yellow); }
    .complaint-card.resolved { border-left: 3px solid var(--green); }
    .complaint-card.dismissed { border-left: 3px solid var(--gray); }

    .card-header {
      display: flex; align-items: center; gap: 16px; padding: 16px 20px;
      cursor: pointer; user-select: none;
    }
    .card-header:hover { background: rgba(255,255,255,0.02); }
    .card-id { font-family: monospace; font-size: 0.8rem; color: var(--muted); min-width: 190px; }
    .card-title { flex: 1; font-weight: 600; font-size: 0.95rem; }
    .card-meta { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
    .status-badge {
      padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
    }
    .status-badge.open { background: rgba(255,45,45,0.15); color: var(--accent); }
    .status-badge.under-review { background: rgba(245,166,35,0.15); color: var(--yellow); }
    .status-badge.resolved { background: rgba(76,175,130,0.15); color: var(--green); }
    .status-badge.dismissed { background: rgba(85,85,85,0.15); color: #aaa; }
    .chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }

    .card-body { display: none; padding: 0 20px 20px; border-top: 1px solid #1e1e1e; }
    .card-body.visible { display: block; }

    .detail-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px; margin: 16px 0;
    }
    .detail-field { }
    .detail-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .detail-value { font-size: 0.9rem; color: var(--text); word-break: break-word; }
    .detail-value a { color: var(--accent); }

    .detail-block { margin: 12px 0; }
    .detail-block .detail-label { margin-bottom: 6px; }
    .detail-block .detail-text {
      background: #0b0b0b; border-radius: 8px; padding: 12px 14px;
      border-left: 3px solid #333; font-size: 0.9rem; line-height: 1.5; color: var(--text);
    }

    .card-actions { display: flex; align-items: flex-start; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .card-actions .notes-input {
      flex: 1; min-width: 200px; padding: 10px 12px; background: #0b0b0b; border: 1px solid #333;
      border-radius: 8px; color: var(--text); font-size: 0.85rem; resize: vertical; min-height: 60px; outline: none;
    }
    .card-actions .notes-input:focus { border-color: #444; }
    .action-buttons { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    .action-btn {
      padding: 8px 14px; border-radius: 8px; border: none; font-size: 0.8rem;
      font-weight: 600; cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
    }
    .action-btn:hover { opacity: 0.85; }
    .btn-review { background: rgba(245,166,35,0.2); color: var(--yellow); border: 1px solid rgba(245,166,35,0.3); }
    .btn-resolve { background: rgba(76,175,130,0.2); color: var(--green); border: 1px solid rgba(76,175,130,0.3); }
    .btn-dismiss { background: rgba(85,85,85,0.2); color: #aaa; border: 1px solid rgba(85,85,85,0.3); }
    .btn-reopen { background: rgba(255,45,45,0.2); color: var(--accent); border: 1px solid rgba(255,45,45,0.3); }
    .btn-save { background: rgba(74,158,255,0.2); color: var(--blue); border: 1px solid rgba(74,158,255,0.3); }
    .btn-delete { background: rgba(255,45,45,0.08); color: #ff6b6b; border: 1px solid rgba(255,45,45,0.2); }

    .empty-state { text-align: center; padding: 64px 24px; color: var(--muted); }
    .empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; }

    .loading { text-align: center; padding: 48px; color: var(--muted); }

    @media (max-width: 640px) {
      .admin-main { padding: 16px; }
      .card-id { display: none; }
      .search-box { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="brand">NThaCityRP</div>
      <h2>Staff Admin Panel</h2>
      <form onsubmit="event.preventDefault(); doLogin();">
        <input type="password" id="admin-password" placeholder="Enter admin password" autocomplete="current-password" />
        <button class="login-btn" type="submit">Sign In</button>
      </form>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-panel">
    <header class="admin-header">
      <div class="brand">NThaCityRP — Admin</div>
      <div class="header-right">
        <span>Complaint Manager</span>
        <button class="logout-btn" onclick="doLogout()">Sign Out</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card total"><div class="stat-label">Total</div><div class="stat-value" id="stat-total">—</div></div>
        <div class="stat-card open"><div class="stat-label">Open</div><div class="stat-value" id="stat-open">—</div></div>
        <div class="stat-card review"><div class="stat-label">Under Review</div><div class="stat-value" id="stat-review">—</div></div>
        <div class="stat-card resolved"><div class="stat-label">Resolved</div><div class="stat-value" id="stat-resolved">—</div></div>
        <div class="stat-card dismissed"><div class="stat-label">Dismissed</div><div class="stat-value" id="stat-dismissed">—</div></div>
      </div>

      <div class="toolbar">
        <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
        <button class="filter-btn" onclick="setFilter('Open', this)">Open</button>
        <button class="filter-btn" onclick="setFilter('Under Review', this)">Under Review</button>
        <button class="filter-btn" onclick="setFilter('Resolved', this)">Resolved</button>
        <button class="filter-btn" onclick="setFilter('Dismissed', this)">Dismissed</button>
        <input class="search-box" type="text" placeholder="Search by name, ID, type…" oninput="renderComplaints()" id="search-input" />
      </div>

      <div class="complaints-list" id="complaints-list">
        <div class="loading">Loading complaints…</div>
      </div>
    </main>
  </div>

  <script>
    let allComplaints = [];
    let currentFilter = 'All';

    function statusClass(status) {
      return (status || 'open').toLowerCase().replace(' ', '-');
    }

    function badgeHtml(status) {
      return `<span class="status-badge ${statusClass(status)}">${status || 'Open'}</span>`;
    }

    function fmtDate(iso) {
      if (!iso) return 'N/A';
      return new Date(iso).toLocaleString();
    }

    async function doLogin() {
      const pw = document.getElementById('admin-password').value;
      const err = document.getElementById('login-error');
      err.textContent = '';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const json = await res.json();
        if (json.success) {
          showPanel();
        } else {
          err.textContent = 'Incorrect password. Try again.';
        }
      } catch {
        err.textContent = 'Connection error. Try again.';
      }
    }

    async function doLogout() {
      await fetch('/api/admin/logout', { method: 'POST' });
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('admin-password').value = '';
    }

    function showPanel() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      loadComplaints();
    }

    async function loadComplaints() {
      try {
        const res = await fetch('/api/complaints');
        if (res.status === 401) { doLogout(); return; }
        const json = await res.json();
        allComplaints = json.complaints || [];
        updateStats();
        renderComplaints();
      } catch {
        document.getElementById('complaints-list').innerHTML = '<div class="empty-state"><h3>Failed to load complaints</h3></div>';
      }
    }

    function updateStats() {
      const counts = { total: allComplaints.length, open: 0, review: 0, resolved: 0, dismissed: 0 };
      allComplaints.forEach(c => {
        if (c.status === 'Open') counts.open++;
        else if (c.status === 'Under Review') counts.review++;
        else if (c.status === 'Resolved') counts.resolved++;
        else if (c.status === 'Dismissed') counts.dismissed++;
      });
      document.getElementById('stat-total').textContent = counts.total;
      document.getElementById('stat-open').textContent = counts.open;
      document.getElementById('stat-review').textContent = counts.review;
      document.getElementById('stat-resolved').textContent = counts.resolved;
      document.getElementById('stat-dismissed').textContent = counts.dismissed;
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderComplaints();
    }

    function renderComplaints() {
      const search = (document.getElementById('search-input').value || '').toLowerCase();
      let list = allComplaints;
      if (currentFilter !== 'All') list = list.filter(c => c.status === currentFilter);
      if (search) list = list.filter(c =>
        (c.id || '').toLowerCase().includes(search) ||
        (c.complaintDiscord || '').toLowerCase().includes(search) ||
        (c.reportedName || '').toLowerCase().includes(search) ||
        (c.complaintType || '').toLowerCase().includes(search) ||
        (c.incidentLocation || '').toLowerCase().includes(search)
      );

      const container = document.getElementById('complaints-list');
      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No complaints found</h3><p>Try adjusting your filter or search.</p></div>';
        return;
      }

      container.innerHTML = list.map(c => {
        const sc = statusClass(c.status);
        const evidenceHtml = c.evidenceLink
          ? `<a href="${c.evidenceLink}" target="_blank" rel="noopener">View Evidence</a>`
          : 'None';
        return `
          <div class="complaint-card ${sc}" id="card-${c.id}">
            <div class="card-header" onclick="toggleCard('${c.id}')">
              <span class="card-id">${c.id}</span>
              <span class="card-title">${c.complaintType} — ${c.reportedName}</span>
              <span class="card-meta">${fmtDate(c.submittedAt)}</span>
              ${badgeHtml(c.status)}
              <span class="chevron" id="chev-${c.id}">▼</span>
            </div>
            <div class="card-body" id="body-${c.id}">
              <div class="detail-grid">
                <div class="detail-field"><div class="detail-label">Discord</div><div class="detail-value">${c.complaintDiscord || 'N/A'}</div></div>
                <div class="detail-field"><div class="detail-label">Reported Person</div><div class="detail-value">${c.reportedName || 'N/A'}</div></div>
                <div class="detail-field"><div class="detail-label">Complaint Type</div><div class="detail-value">${c.complaintType || 'N/A'}</div></div>
                <div class="detail-field"><div class="detail-label">Incident Date</div><div class="detail-value">${c.incidentDate || 'N/A'}</div></div>
                <div class="detail-field"><div class="detail-label">Location</div><div class="detail-value">${c.incidentLocation || 'N/A'}</div></div>
                <div class="detail-field"><div class="detail-label">Witnesses</div><div class="detail-value">${c.witnesses || 'None'}</div></div>
                <div class="detail-field"><div class="detail-label">Evidence</div><div class="detail-value">${evidenceHtml}</div></div>
                <div class="detail-field"><div class="detail-label">Submitted</div><div class="detail-value">${fmtDate(c.submittedAt)}</div></div>
                ${c.updatedAt ? `<div class="detail-field"><div class="detail-label">Last Updated</div><div class="detail-value">${fmtDate(c.updatedAt)}</div></div>` : ''}
              </div>
              <div class="detail-block">
                <div class="detail-label">Description</div>
                <div class="detail-text">${c.description || 'N/A'}</div>
              </div>
              <div class="detail-block">
                <div class="detail-label">Desired Resolution</div>
                <div class="detail-text">${c.resolution || 'N/A'}</div>
              </div>
              <div class="card-actions">
                <textarea class="notes-input" id="notes-${c.id}" placeholder="Staff notes…">${c.staffNotes || ''}</textarea>
                <div class="action-buttons">
                  <button class="action-btn btn-review" onclick="updateStatus('${c.id}', 'Under Review')">Mark Under Review</button>
                  <button class="action-btn btn-resolve" onclick="updateStatus('${c.id}', 'Resolved')">Mark Resolved</button>
                  <button class="action-btn btn-dismiss" onclick="updateStatus('${c.id}', 'Dismissed')">Dismiss</button>
                  <button class="action-btn btn-reopen" onclick="updateStatus('${c.id}', 'Open')">Reopen</button>
                  <button class="action-btn btn-save" onclick="saveNotes('${c.id}')">Save Notes</button>
                  <button class="action-btn btn-delete" onclick="deleteComplaint('${c.id}')">Delete</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCard(id) {
      const body = document.getElementById('body-' + id);
      const chev = document.getElementById('chev-' + id);
      body.classList.toggle('visible');
      chev.classList.toggle('open');
    }

    async function updateStatus(id, status) {
      const notes = document.getElementById('notes-' + id)?.value;
      const res = await fetch(`/api/complaint/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status, staffNotes: notes })
      });
      const json = await res.json();
      if (json.success) {
        const idx = allComplaints.findIndex(c => c.id === id);
        if (idx !== -1) allComplaints[idx] = json.complaint;
        updateStats();
        renderComplaints();
        document.getElementById('body-' + id)?.classList.add('visible');
        document.getElementById('chev-' + id)?.classList.add('open');
      }
    }

    async function saveNotes(id) {
      const notes = document.getElementById('notes-' + id)?.value || '';
      const res = await fetch(`/api/complaint/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ staffNotes: notes })
      });
      const json = await res.json();
      if (json.success) {
        const idx = allComplaints.findIndex(c => c.id === id);
        if (idx !== -1) allComplaints[idx] = json.complaint;
        const btn = event.target;
        btn.textContent = 'Saved!';
        setTimeout(() => { btn.textContent = 'Save Notes'; }, 1500);
      }
    }

    async function deleteComplaint(id) {
      if (!confirm(`Delete complaint ${id}? This cannot be undone.`)) return;
      const res = await fetch(`/api/complaint/${id}`, { method: 'DELETE' });
      const json = await res.json();
      if (json.success) {
        allComplaints = allComplaints.filter(c => c.id !== id);
        updateStats();
        renderComplaints();
      }
    }

    document.getElementById('admin-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    (async () => {
      const res = await fetch('/api/admin/session');
      const json = await res.json();
      if (json.loggedIn) showPanel();
    })();
  </script>
</body>
</html>
