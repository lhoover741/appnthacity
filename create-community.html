<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Community | GTAVCAD</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-platform-page="true">
<header class="site-header"><div class="topbar container"><a class="brand" href="/">GTAVCAD</a><button class="nav-toggle" aria-label="Open navigation">Menu</button><nav class="global-nav" aria-label="Main navigation"><a href="/communities">Communities</a><a href="/login">Login</a><a class="button button-primary" href="/create-community">Create Community</a><a class="button button-ghost" href="/join-community">Join Community</a></nav></div></header>
<main>
  <section class="panel section page-hero"><div class="container"><p class="eyebrow">Welcome to GTAVCAD</p><h1>Create a Community</h1><p class="intro">Start a new tenant with custom community name, CAD name, slug, and colors.</p></div></section>
  <section class="container section content-grid">
    <article class="card info-card">
      <h2>Community setup</h2>
      <form id="create-community-form" class="system-form">
        <label>Community name <input name="name" required placeholder="Metro RP" /></label>
        <label>Slug <input name="slug" required placeholder="metro-rp" pattern="[a-z0-9-]+" /></label>
        <label>CAD name <input name="cad_name" required placeholder="Metro CAD" /></label>
        <label>Primary color <input name="primary_color" type="color" value="#1a1a1a" /></label>
        <label>Secondary color <input name="secondary_color" type="color" value="#0066cc" /></label>
        <button class="button button-primary" type="submit">Create Community</button>
      </form>
      <p id="create-community-status" role="status"></p>
    </article>
  </section>
</main>
<footer class="site-footer"><div class="container footer-grid"><p>&copy; <span class="current-year"></span> GTAVCAD.</p><p>Create or Join a Community.</p></div></footer>
<script src="/assets/js/main.js"></script>
<script>
document.getElementById('create-community-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const status = document.getElementById('create-community-status');
  const form = new FormData(event.target);
  const res = await fetch('/api/communities/create', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(form))});
  const data = await res.json();
  if (res.status === 401) { window.location.href = '/login'; return; }
  if (!res.ok || !data.success) { status.textContent = data.error || 'Community creation failed'; return; }
  status.textContent = 'Community created. Opening CAD…';
  sessionStorage.setItem('gtavcadCommunityCreated', JSON.stringify({
    communityName: data.community.name,
    communitySlug: data.community.slug,
    inviteCode: data.invite_code || (data.invite && data.invite.invite_code),
    redirectUrl: data.redirect_url || `/c/${data.community.slug}/`,
  }));
  window.location.href = data.redirect_url || `/c/${data.community.slug}/`;
});
</script>
</body>
</html>
