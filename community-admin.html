<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Community Admin</title>
<style>body{margin:0;background:#090909;color:#eee;font-family:Arial}.wrap{padding:1rem}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}.card{background:#121212;border:1px solid #2b2b2b;border-radius:10px;padding:.7rem}.status{padding:.2rem .45rem;border-radius:99px}.ONLINE{background:#093;color:#bfffd8}.IDLE{background:#664b00;color:#ffe28b}.OFFLINE{background:#5b1111;color:#ffc6c6}.panel{margin-top:1rem;background:#121212;border:1px solid #2b2b2b;border-radius:10px;padding:.8rem}.tbl{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:.45rem;border-bottom:1px solid #222;white-space:nowrap}button{background:#1e1e1e;border:1px solid #444;color:#fff;border-radius:8px;padding:.25rem .5rem} @media(max-width:700px){th,td{font-size:.8rem}}</style></head>
<body><div class='wrap'><h2>Community Administration</h2><div id='meta'></div><div id='cards' class='cards'></div><div class='panel'><h3>Members</h3><div class='tbl'><table><thead><tr><th>Username</th><th>Role</th><th>Callsign</th><th>Department</th><th>Last Active</th><th>Status</th><th>Actions</th></tr></thead><tbody id='members'></tbody></table></div></div><div class='panel'><h3>Invites</h3><div id='invites'></div></div><div class='panel'><h3>Activity Logs</h3><div id='logs'></div></div></div>
<script>
const qs=s=>document.querySelector(s);const status=t=>!t?'OFFLINE':((Date.now()-new Date(t))/6e4<5?'ONLINE':(Date.now()-new Date(t))/6e4<30?'IDLE':'OFFLINE'); const stub=n=>alert(n+': pending dedicated backend endpoint');
async function load(){const r=await fetch('/api/community-admin/overview');if(r.status===403){document.body.innerHTML='<h2 style="padding:2rem;color:#f88">Forbidden: CommunityOwner/Admin required.</h2>';return;}const d=await r.json();if(!d.success)return;const o=d.overview;qs('#meta').textContent='Last API request: '+new Date().toLocaleTimeString();qs('#cards').innerHTML=[['Members',o.total_members],['Online',o.online_members],['Officers',o.officers],['Civilians',o.civilians],['Active Calls',o.active_calls],['Active Warrants',o.active_warrants]].map(i=>`<div class='card'><div>${i[0]}</div><h3>${i[1]}</h3></div>`).join('');
const rows=(o.members||[]).map(m=>{const st=m.status||status(m.last_active);return `<tr><td>${m.username}</td><td>${m.role}</td><td>${m.callsign||'—'}</td><td>${m.department||'—'}</td><td>${m.last_active||'—'}</td><td><span class='status ${st}'>${st}</span></td><td><button onclick="stub('Promote')">Promote</button><button onclick="stub('Demote')">Demote</button><button onclick="stub('Approve Officer')">Approve Officer</button><button onclick="stub('Remove Officer')">Remove Officer</button><button onclick="stub('Assign Callsign')">Assign Callsign</button><button onclick="stub('Reset Password')">Reset Password</button><button onclick="stub('Ban Member')">Ban</button></td></tr>`}).join('')||"<tr><td colspan='7'>No members found.</td></tr>";qs('#members').innerHTML=rows;
qs('#invites').innerHTML=(o.invites||[]).map(v=>`<div>${v.invite_code} (${v.role})</div>`).join('')||'No active invites.';
qs('#logs').innerHTML=(o.activity||[]).map(x=>`<div>${x.message||x.msg||'Activity'} - ${x.created_at||new Date().toLocaleTimeString()}</div>`).join('')||'<div>No recent activity.</div>';}
load();setInterval(load,15000);
</script></body></html>
